---
- name: Добавление репозитория Zabbix
  shell: |
    wget -q https://repo.zabbix.com/zabbix/6.4/ubuntu/pool/main/z/zabbix-release/zabbix-release_6.4-1+ubuntu22.04_all.deb
    dpkg -i zabbix-release_6.4-1+ubuntu22.04_all.deb
    apt update
  args:
    creates: /etc/apt/sources.list.d/zabbix.list

- name: Установка Zabbix server, frontend, agent
  apt:
    name:
      - zabbix-server-pgsql
      - zabbix-frontend-php
      - zabbix-nginx-conf
      - zabbix-sql-scripts
      - zabbix-agent
      - postgresql-client-{{ postgresql_version }}
    state: present

- name: Создание БД Zabbix на PostgreSQL master
  become_user: postgres
  postgresql_db:
    name: zabbix
    encoding: UTF-8
  delegate_to: "{{ hostvars['db_master']['ansible_host'] }}"

- name: Создание пользователя БД для Zabbix
  become_user: postgres
  postgresql_user:
    name: zabbix
    password: "{{ zabbix_db_password }}"
    db: zabbix
    priv: ALL
  delegate_to: "{{ hostvars['db_master']['ansible_host'] }}"

- name: Импорт схемы Zabbix
  shell: |
    zcat /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz | PGPASSWORD={{ zabbix_db_password }} psql -h {{ hostvars['db_master']['internal_ip'] }} -U zabbix -d zabbix
  args:
    creates: /var/lib/zabbix/.schema_done

- name: Создать файл-флаг #Чтобы не пытался каждый раз импортировать схему
  file:
    path: /var/lib/zabbix/.schema_done
    state: touch

- name: Настройка подключения Zabbix к БД
  lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: "DBHost", value: "{{ hostvars['db_master']['internal_ip'] }}" }
    - { key: "DBName", value: "zabbix" }
    - { key: "DBUser", value: "zabbix" }
    - { key: "DBPassword", value: "{{ zabbix_db_password }}" }
  notify: restart zabbix-server

- name: Настройка Nginx для Zabbix
  copy:
    dest: /etc/nginx/sites-available/zabbix
    content: |
      server {
          listen 8080;
          server_name _;
          root /usr/share/zabbix;
          index index.php;
          location / {
              try_files $uri $uri/ =404;
          }
          location ~ \.php$ {
              fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
              fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
              include fastcgi_params;
          }
      }
  notify: restart nginx

- name: Включение сайта Zabbix
  file:
    src: /etc/nginx/sites-available/zabbix
    dest: /etc/nginx/sites-enabled/zabbix
    state: link
  notify: restart nginx

- name: Старт сервисов Zabbix
  systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - zabbix-server
    - zabbix-agent
