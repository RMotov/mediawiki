- name: Добавляем репозиторий Ondrej PHP
  apt_repository:
    repo: 'ppa:ondrej/php'
    state: present
    update_cache: yes

- name: Установка Nginx, PHP и необходимых модулей
  apt:
    name:
      - php8.3-fpm
      - php8.3-cli
      - php8.3-pgsql
      - php8.3-mbstring
      - php8.3-intl
      - php8.3-xml
      - php8.3-curl
      - php8.3-zip
      - php8.3-gd
      - composer
      - nginx
    state: present
  register: apt_result
  until: apt_result is success
  retries: 10
  delay: 30

- name: Скачать MediaWiki
  get_url:
    url: "https://releases.wikimedia.org/mediawiki/{{ mw_version[:4] }}/mediawiki-{{ mw_version }}.tar.gz"
    dest: "/tmp/mediawiki.tar.gz"

- name: Удаляем старый MediaWiki, если он распакован неправильно
  file:
    path: "{{ mw_install_dir }}"
    state: absent
  when: force_reinstall | default(false)

- name: Убеждаемся, что директория MediaWiki существует
  file:
    path: "{{ mw_install_dir | dirname }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Распаковать в каталог приложения
  unarchive:
    src: "/tmp/mediawiki.tar.gz"
    dest: "{{ mw_install_dir}}"
    remote_src: yes
    owner: www-data
    group: www-data
    extra_opts: [--strip-components=1] # Удаляем верхний уровень, чтобы содержимое попало прямо в /var/www/mediawiki
    creates: "{{ mw_install_dir }}/index.php"

- name: Удаляем старую директорию расширения, если есть
  file:
    path: "{{ mw_install_dir }}/extensions/AWS"
    state: absent
  become: yes

- name: Убеждаемся, что директория extensions существует
  file:
    path: "{{ mw_install_dir }}/extensions"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  become: yes

- name: Клонируем расширение AWS
  git:
    repo: "https://github.com/edwardspec/mediawiki-aws-s3.git"
    dest: "{{ mw_install_dir }}/extensions/AWS"
    version: "master"
    depth: 1
  become: yes

- name: Создаём composer.local.json для подключения зависимостей расширения
  copy:
    dest: "{{ mw_install_dir }}/composer.local.json"
    content: |
      {
          "extra": {
              "merge-plugin": {
                  "include": [
                      "extensions/AWS/composer.json"
                  ]
              }
          }
      }
    owner: www-data
    group: www-data
    mode: '0644'
  become: yes

- name: Удаляем старый composer.lock, если он есть (чтобы избежать конфликта прав)
  file:
    path: "{{ mw_install_dir }}/composer.lock"
    state: absent
  become: yes

- name: Устанавливаем зависимости через Composer от root
  composer:
    command: update
    working_dir: "{{ mw_install_dir }}"
    no_dev: yes
    # Не указываем become_user — работаем от root
  environment:
    COMPOSER_HOME: "/tmp/composer_home_{{ ansible_date_time.epoch }}"
  become: yes

- name: Меняем владельца всех файлов MediaWiki на www-data
  file:
    path: "{{ mw_install_dir }}"
    state: directory
    owner: www-data
    group: www-data
    recurse: yes
  become: yes

- name: Удаляем временную домашнюю директорию Composer
  file:
    path: "/tmp/composer_home_{{ ansible_date_time.epoch }}"
    state: absent
  become: yes

- name: Проверяем наличие extension.json у расширения AWS
  stat:
    path: "{{ mw_install_dir }}/extensions/AWS/extension.json"
  register: aws_extension_json

- name: Провал, если extension.json не найден
  fail:
    msg: "Расширение AWS установлено некорректно: отсутствует {{ mw_install_dir }}/extensions/AWS/extension.json"
  when: not aws_extension_json.stat.exists

- name: Создать каталог для логов
  file:
    path: /var/log/mediawiki
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

