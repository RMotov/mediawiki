- name: Настройка PHP-FPM пула для MediaWiki
  template:
    src: www-mediawiki.conf.j2
    dest: /etc/php/8.3/fpm/pool.d/mediawiki.conf
  notify: restart php-fpm

- name: Настройка Nginx виртуального хоста для MediaWiki (на app серверах, для статики)
  template:
    src: mediawiki-app-nginx.conf.j2
    dest: /etc/nginx/sites-available/mediawiki
  notify: restart nginx

- name: Отключаем сайт default (удаляем симлинк)
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx

- name: Включаем сайт mediawiki (создаём симлинк)
  file:
    src: /etc/nginx/sites-available/mediawiki
    dest: /etc/nginx/sites-enabled/mediawiki
    state: link
  notify: restart nginx
  
- name: Перезапускаем Nginx
  systemd:
    name: nginx
    state: restarted
    daemon_reload: yes
  become: yes