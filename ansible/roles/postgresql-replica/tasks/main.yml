---
- name: Установка PostgreSQL
  apt:
    name: "postgresql-{{ postgresql_version }}"
    state: present
  register: apt_result
  until: apt_result is success
  retries: 10
  delay: 30

- name: Установка системной библиотеки psycopg2 для работы Ansible с Postgres
  apt:
    name: python3-psycopg2
    state: present
    update_cache: yes

- name: Разрешаем PostgreSQL слушать все сетевые интерфейсы
  lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses ="
    line: "listen_addresses = '*'"
  notify: restart postgresql

- name: Разрешаем подключения для MediaWiki в pg_hba.conf
  lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    line: "host {{ db_name }} all 10.10.0.0/24 md5"
  notify: restart postgresql

- name: Остановка PostgreSQL для подготовки к резервному копированию
  systemd:
    name: postgresql
    state: stopped

- name: Очистка созданной при установке PostgreSQL директории с данными
  file:
    path: /var/lib/postgresql/{{ postgresql_version }}/main
    state: absent

- name: Создание пустой директории данных с корректными правами
  file:
    path: /var/lib/postgresql/{{ postgresql_version }}/main
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Выполнение pg_basebackup с мастера
  become_user: postgres
  command: >
    pg_basebackup -h {{ hostvars['db_master']['internal_ip'] }}
    -U {{ replication_user }}
    -D /var/lib/postgresql/{{ postgresql_version }}/main
    -Fp -Xs -P -R
  environment:
    PGPASSWORD: "{{ replication_password }}"
  register: backup_result
  retries: 3
  delay: 5

- name: Проверка прав после создания резервной копии
  file:
    path: /var/lib/postgresql/{{ postgresql_version }}/main
    owner: postgres
    group: postgres
    recurse: yes

- name: Старт реплики PostgreSQL
  systemd:
    name: postgresql
    state: started
    enabled: yes

- name: Проверка, что реплика запущена и идет процесс синхронизации
  become_user: postgres
  command: psql -c "SELECT pg_is_in_recovery();"
  register: recovery_status
  changed_when: false

- name: Статус репликации
  debug:
    msg: "Replica recovery status: {{ recovery_status.stdout }}"